<!DOCTYPE html>
<html lang="en" class="nowo-ui-html nowo-ui--bootstrap5">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP Log Entries — HTTP Log</title>
                    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
            <link rel="stylesheet" href="/bundles/nowouikit/css/nowo-ui.css">
    </head>
<body class="nowo-ui-body">
    <div class="nowo-ui-container container py-4">
        <header class="nowo-ui-header mb-4">
            <h1 class="nowo-ui-title">HTTP Log</h1>
        </header>
        <main class="nowo-ui-main">
                                <div class="nowo-ui-filter card mb-4">
    <div class="card-body">
        <form name="http_log_filter" method="get" class="nowo-ui-filter-form row g-2 align-items-end">
            <div class="col-md-2"><div data-golden-form-row="method"><label for="http_log_filter_method">Method</label></div></div>
            <div class="col-md-2"><div data-golden-form-row="routeName"><label for="http_log_filter_routeName">Route name</label></div></div>
            <div class="col-md-1"><div data-golden-form-row="statusCode"><label for="http_log_filter_statusCode">Status code</label></div></div>
            <div class="col-md-2"><div data-golden-form-row="clientIp"><label for="http_log_filter_clientIp">Client IP</label></div></div>
            <div class="col-md-2"><div data-golden-form-row="path"><label for="http_log_filter_path">Path</label></div></div>
            <div class="col-md-2"><div data-golden-form-row="bodyContentType"><label for="http_log_filter_bodyContentType">Body type</label></div></div>
            <div class="col-md-2"><div data-golden-form-row="createdFrom"><label for="http_log_filter_createdFrom">Created from</label></div></div>
            <div class="col-md-2"><div data-golden-form-row="createdTo"><label for="http_log_filter_createdTo">Created to</label></div></div>
            <div class="col-md-3"><div data-golden-form-row="q"><label for="http_log_filter_q">Search</label></div></div>
            <div class="col-md-2">
                <button type="submit" class="nowo-ui-btn nowo-ui-btn--primary btn btn-primary nowo-ui-btn-filter">Filter</button>
            </div>
        </form>
    </div>
</div>


    <div class="nowo-ui-toolbar d-flex justify-content-between align-items-center mb-3">
        <p class="nowo-ui-summary mb-0">0 entries</p>
        <div class="nowo-ui-actions">
            <form method="post" action="/admin/http-log/export" class="d-inline">
                <input type="hidden" id="format" name="format" value="csv" /><input type="hidden" id="_token" name="_token" value="token-http_log_export" />
                <button type="submit" class="nowo-ui-btn nowo-ui-btn--secondary nowo-ui-btn--sm btn btn-outline-secondary btn-sm nowo-ui-btn-export">Export CSV</button>
            </form>

            <form method="post" action="/admin/http-log/export" class="d-inline ms-1">
                <input type="hidden" id="format" name="format" value="json" /><input type="hidden" id="_token" name="_token" value="token-http_log_export" />
                <button type="submit" class="nowo-ui-btn nowo-ui-btn--secondary nowo-ui-btn--sm btn btn-outline-secondary btn-sm nowo-ui-btn-export">Export JSON</button>
            </form>

            <form method="post" action="/admin/http-log/purge" class="d-inline ms-1" onsubmit="return confirm(&#039;Purge\u0020HTTP\u0020log\u0020entries\u0020matching\u0020the\u0020retention\u0020policy\u003F&#039;);">
                <input type="hidden" id="_token" name="_token" value="token-http_log_purge" />
                <button type="submit" class="nowo-ui-btn nowo-ui-btn--danger nowo-ui-btn--sm btn btn-outline-danger btn-sm nowo-ui-btn-purge">Purge old entries</button>
            </form>
        </div>
    </div>

    <div class="nowo-ui-table-wrap table-responsive">
        <table class="table table-striped table-sm nowo-ui-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Created at</th>
                    <th>Method</th>
                    <th>Path</th>
                    <th>Status</th>
                    <th>Duration</th>
                    <th>Client IP</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                                    <tr>
                        <td colspan="8" class="text-muted">No HTTP log entries found.</td>
                    </tr>
                            </tbody>
        </table>
    </div>

            </main>
    </div>
                <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    
    </body>
</html>
