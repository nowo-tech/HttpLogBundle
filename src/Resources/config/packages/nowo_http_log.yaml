nowo_http_log:
    enabled: true
    environments: []
    async: true
    sampling_rate: 1.0
    track_sub_requests: false
    ignore_routes:
        - '_wdt'
        - '_profiler'
        - 'web_profiler*'
        - 'nowo_http_log_*'
    ignore_path_prefixes:
        - '/admin/http-log'
    # Also skip /_nowo/ (HotReload), /sw.js and /manifest.webmanifest (PWA); merged with the list above.
    ignore_default_path_prefixes: true
    capture:
        request_headers: true
        request_body: false
        response_headers: true
        client_ip: true
        user: true
        max_body_bytes: 65536
        response_body_by_type:
            html: false
            json: true
            soap: true
            xml: true
            text: false
            binary: false
            other: false
    redaction:
        headers:
            - Authorization
            - Cookie
            - Set-Cookie
            - X-Api-Key
        query_params:
            - password
            - _password
            - token
            - _token
            - _csrf_token
            - api_key
        json_paths:
            - '*.password'
            - '*._password'
            - '*.token'
            - '*._token'
            - '*._csrf_token'
    retention:
        days: 30
        purge_batch_size: 1000
    export:
        formats:
            - csv
            - json
        max_sync_rows: 1000
        # Background (Messenger) exports: private directory (0700, files 0600), deleted after ttl_hours.
        directory: '%kernel.project_dir%/var/http-log/exports'
        ttl_hours: 24
    web_ui:
        enabled: true
        path_prefix: /admin/http-log
        # null = UiKit admin layout (nowo_ui_kit.layouts.admin); CSS stack / icons / theme come from nowo_ui_kit.
        layout_template: null
        page_size: 50
    security:
        access_roles:
            - ROLE_ADMIN
        access_checker: null
        allow_unauthenticated: false
