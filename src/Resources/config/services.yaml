services:
    _defaults:
        autowire: true
        autoconfigure: true

    Nowo\HttpLogBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../Entity/'
            - '../../Enum/'
            - '../../Message/'
            - '../../View/'
            - '../../NowoHttpLogBundle.php'
            - '../../Controller/'
            # HL-1 usage capture: registered by the extension, only for the features a host enables.
            - '../../Context/'
            - '../../HttpClient/'
            - '../../Mailer/'
            - '../../Messenger/'
            - '../../Usage/'
            - '../../Doctrine/UsageColumnsListener.php'
            - '../../Doctrine/PathPrefixColumnListener.php'
            # HL-1 1.16: named channels, rollup, usage erasure and the backfill command (registered by the extension).
            - '../../Inbound/'
            - '../../Rollup/'
            - '../../Privacy/HttpLogUsageEraser.php'
            # GDPR ports (1.18): value objects, and the UserKit adapters (registered by the extension with UserKit installed).
            - '../../Privacy/HttpLogPersonalDataSubject.php'
            - '../../Privacy/HttpLogErasureResult.php'
            - '../../Privacy/HttpLogPersonalDataErasedEvent.php'
            - '../../Privacy/HttpLogClientIpWindow.php'
            - '../../Privacy/UserKit/'
            - '../../Command/RollupBackfillCommand.php'

    Nowo\HttpLogBundle\Repository\:
        resource: '../../Repository/'

    # REQ-ORM-002: removed by the extension when doctrine.table_prefix and doctrine.table_name_prefix keep their defaults.
    Nowo\HttpLogBundle\Doctrine\TablePrefixListener:
        arguments:
            $tablePrefix: '%nowo_http_log.doctrine.table_prefix%'
            $tableNamePrefix: '%nowo_http_log.doctrine.table_name_prefix%'
            $usageColumns: '%nowo_http_log.usage.enabled%'
            $rollup: '%nowo_http_log.rollup.enabled%'
        tags:
            - { name: doctrine.event_listener, event: loadClassMetadata }

    # REQ-SF-003: commands are registered by #[AsCommand] + autoconfigure (no manual console.command tag).
    Nowo\HttpLogBundle\Command\:
        resource: '../../Command/'
        exclude: '../../Command/RollupBackfillCommand.php'

    Nowo\HttpLogBundle\Command\ExportHttpLogCommand:
        arguments:
            $exportFormats: '%nowo_http_log.export.formats%'

    Nowo\HttpLogBundle\Service\HttpLogRedactor:
        arguments:
            $headerKeys: '%nowo_http_log.redaction.headers%'
            $queryParamKeys: '%nowo_http_log.redaction.query_params%'
            $jsonPaths: '%nowo_http_log.redaction.json_paths%'

    Nowo\HttpLogBundle\Service\CapturePolicy:
        arguments:
            $captureConfig: '%nowo_http_log.capture%'

    Nowo\HttpLogBundle\Service\HttpLogRecorder:
        arguments:
            $async: '%nowo_http_log.async%'
            $captureConfig: '%nowo_http_log.capture%'

    Nowo\HttpLogBundle\EventSubscriber\HttpLogSubscriber:
        arguments:
            $enabled: '%nowo_http_log.enabled%'
            $environments: '%nowo_http_log.environments%'
            $samplingRate: '%nowo_http_log.sampling_rate%'
            $trackSubRequests: '%nowo_http_log.track_sub_requests%'
            $ignoreRoutes: '%nowo_http_log.ignore_routes%'
            $ignorePathPrefixes: '%nowo_http_log.ignore_path_prefixes%'
            $kernelEnvironment: '%kernel.environment%'
            $ignoreUnrouted: '%nowo_http_log.ignore_unrouted%'

    Nowo\HttpLogBundle\Service\ExportFileStore:
        arguments:
            $directory: '%nowo_http_log.export.directory%'
            $ttlSeconds: '%nowo_http_log.export.ttl_seconds%'

    Nowo\HttpLogBundle\Service\PurgeHttpLogService:
        arguments:
            $retentionConfig: '%nowo_http_log.retention%'
            $channelRetention: '%nowo_http_log.usage.channel_retention%'

    # Public API for personal-data erasure (GDPR): hosts never run SQL on the bundle table.
    # LY-L2: skip list of the values erased in the current request / command / message (reset at every boundary).
    Nowo\HttpLogBundle\Privacy\HttpLogErasedSubjects:
        tags:
            - { name: kernel.event_subscriber }
            - { name: kernel.reset, method: reset }

    Nowo\HttpLogBundle\Privacy\HttpLogPersonalDataEraser:
        arguments:
            $retentionConfig: '%nowo_http_log.retention%'

    Nowo\HttpLogBundle\Privacy\HttpLogPersonalDataEraserInterface:
        alias: Nowo\HttpLogBundle\Privacy\HttpLogPersonalDataEraser
        public: true

    # GDPR erasure by subject (result + event after the port's own commit) and export (1.18).
    Nowo\HttpLogBundle\Privacy\HttpLogPersonalDataErasureInterface:
        alias: Nowo\HttpLogBundle\Privacy\HttpLogPersonalDataErasure
        public: true

    Nowo\HttpLogBundle\Privacy\HttpLogPersonalDataExporter:
        arguments:
            $exportLimit: '%nowo_http_log.personal_data.export_limit%'
            $retentionConfig: '%nowo_http_log.retention%'

    Nowo\HttpLogBundle\Privacy\HttpLogPersonalDataExporterInterface:
        alias: Nowo\HttpLogBundle\Privacy\HttpLogPersonalDataExporter
        public: true

    # SPI of the UserKit bridge; personal_data.subject_resolver replaces the alias.
    Nowo\HttpLogBundle\Privacy\HttpLogPersonalDataSubjectResolverInterface:
        alias: Nowo\HttpLogBundle\Privacy\UserIdentifierSubjectResolver

    # autoconfigure: false (REQ-SF-004 rule 7) — on Symfony >= 7.3 a #[Route] class is autoconfigured with the
    # routing.controller tag, and the host's `routing.controllers` resource would then expose the admin UI without
    # the host importing @NowoHttpLogBundle/Resources/config/routes.yaml (opt-in only). The tags autoconfiguration
    # used to add are explicit: controller.service_arguments + container.service_subscriber (AbstractController).
    Nowo\HttpLogBundle\Controller\HttpLogAdminController:
        autoconfigure: false
        arguments:
            $allowUnauthenticated: '%nowo_http_log.security.allow_unauthenticated%'
            $maxSyncExportRows: '%nowo_http_log.export.max_sync_rows%'
            $pageSize: '%nowo_http_log.web_ui.page_size%'
            $webUi: '%nowo_http_log.web_ui%'
            $exportFormats: '%nowo_http_log.export.formats%'
            $usageChannels: '%nowo_http_log.usage.channels%'
        tags: ['controller.service_arguments', 'container.service_subscriber']

    # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
    Nowo\HttpLogBundle\Form\:
        resource: '../../Form/'
        exclude: '../../Form/DataTransformer/'
        tags: ['form.type']
